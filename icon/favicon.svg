<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Site mark">
  <title>Site mark</title>
  <defs>
    <linearGradient id="flow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffc21f"/>
      <stop offset="18%"  stop-color="#ff7a1a"/>
      <stop offset="35%"  stop-color="#e8192c"/>
      <stop offset="52%"  stop-color="#ff2d78"/>
      <stop offset="68%"  stop-color="#a44bff"/>
      <stop offset="84%"  stop-color="#1f6dff"/>
      <stop offset="100%" stop-color="#12b4c4"/>
    </linearGradient>
  </defs>

  <!-- Ink ground in light mode; the gradient mark carries the identity in both. -->
  <rect width="64" height="64" rx="6" fill="#0d0d10"/>
  <rect x="8" y="12" width="48" height="6" fill="url(#flow)"/>
  <rect x="8" y="29" width="34" height="6" fill="url(#flow)"/>
  <rect x="8" y="46" width="22" height="6" fill="url(#flow)"/>
</svg>
